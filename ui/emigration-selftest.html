<div class="emig-selftest-root w-full h-full flex items-center justify-center">
    <fxs-frame frame-style="f2" class="emig-selftest-frame relative flex flex-col">
        <fxs-header class="emig-selftest-title relative font-title text-xl uppercase text-secondary"
                    filigree-style="h4" title="LOC_EMIGRATION_SELFTEST_OPEN"></fxs-header>
        <div class="emig-selftest-body relative flex flex-col flex-auto">
            <!-- The self-test check rows + action buttons (emigration-selftest.js) mount here. -->
            <div class="emig-selftest-host w-full"></div>
        </div>
        <fxs-close-button data-ia-close
            data-audio-group-ref="audio-screen-unlocks"
            data-audio-activate-ref="data-audio-close-selected"
            data-audio-press-ref="data-audio-close-press"></fxs-close-button>
    </fxs-frame>
</div>
