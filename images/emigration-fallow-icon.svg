<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Fallow-tile marker for the on-map "vacant land" indicator: an improved rural tile that has
     lost its worker to emigration (developed, but nobody living/working it). Same idiom as
     emigration-dock-icon.svg — painted as solid black shapes and consumed as a CSS/mask alpha,
     so the fill colour here is irrelevant; the renderer tints it. Motif: a SINGLE figure with a
     downward arrow (population lost here), deliberately distinct from the dock icon's TWO figures +
     rightward flow arrow (migration in general). -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <g fill="#000000">
    <!-- The remaining/departed inhabitant: one figure -->
    <circle cx="20" cy="16" r="8"/>
    <path d="M12,50 L12,32 a8,8 0 0 1 16,0 L28,50 Z"/>
    <!-- Downward arrow = population lost from this tile -->
    <path d="M43,12 L51,12 L51,33 L43,33 Z"/>
    <path d="M37,31 L57,31 L47,52 Z"/>
  </g>
</svg>
